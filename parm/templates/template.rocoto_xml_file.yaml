workflow:
  attrs:
    realtime: false
    scheduler: {{ SCHED }}
    cyclethrottle: 24
    taskthrottle: 24
  cycledef:
    - attrs:
        group: cycled
      spec: {{ DATE_FIRST_CYCLE }}00 {{ DATE_LAST_CYCLE }}00 {{ DATE_CYCLE_FREQ_HR }}:00:00
    - attrs:
        group: first_cycle
      spec: {{ DATE_FIRST_CYCLE }}00 {{ DATE_FIRST_CYCLE }}00 {{ DATE_CYCLE_FREQ_HR }}:00:00
{%- if date_second_cycle is not none %}
    - attrs:
        group: cycled_from_second
      spec: {{ date_second_cycle }}00 {{ DATE_LAST_CYCLE }}00 {{ DATE_CYCLE_FREQ_HR }}:00:00
{%- endif %}
  entities:
    ACCOUNT: "{{ ACCOUNT }}"
    envir: "{{ envir }}"
    exp_case_path: "{{ exp_case_path }}"
    MACHINE: "{{ MACHINE }}"
    NATIVE: "{{ NATIVE }}"
    NPROCS_ANALYSIS: "{{ NPROCS_ANALYSIS }}"
    NPROCS_PLOT_STATS: "{{ NPROCS_PLOT_STATS }}"
    NPROCS_PREP_DATA: "{{ NPROCS_PREP_DATA }}"
    nnodes_analysis: "{{ nnodes_analysis }}"
    nnodes_fcst_ic: "{{ nnodes_fcst_ic }}"
    nnodes_forecast: "{{ nnodes_forecast }}"
    nnodes_prep_data: "{{ nnodes_prep_data }}"
    nprocs_forecast: "{{ nprocs_forecast }}"
    nprocs_per_node_analysis: "{{ nprocs_per_node_analysis }}"
    nprocs_per_node_fcst_ic: "{{ nprocs_per_node_fcst_ic }}"
    nprocs_per_node_forecast: "{{ nprocs_per_node_forecast }}"
    nprocs_per_node_prep_data: "{{ nprocs_per_node_prep_data }}"
    PARTITION_QUEUE: "{{ PARTITION_QUEUE }}"
    PTMP: "{{ PTMP }}"
    QOS: "{{ QOS }}"
    WARMSTART_DIR: "{{ WARMSTART_DIR }}"
    HOMEufsda: "&exp_basedir;/ufs-da-workflow"
    COMROOT: "&PTMP;/&envir;/com"
    DATAROOT: "&PTMP;/&envir;/tmp"
    LOGDIR: "&COMROOT;/output/logs"
    LOGFN_SUFFIX: "<cyclestr>_@Y@m@d@H.log</cyclestr>"
    PDY:  "<cyclestr>@Y@m@d</cyclestr>"
    cyc: "<cyclestr>@H</cyclestr>"
    DATADEP_COLDSTART: "<cyclestr>&exp_case_path;/task_skip_coldstart_@Y@m@d@H.txt</cyclestr>"
    DATADEP_FIRSTCYC: "<cyclestr>&exp_case_path;/task_run_firstcyc_@Y@m@d@H.txt</cyclestr>"
    DATADEP_SFC1: "<cyclestr>&DATAROOT;/DATA_SHARE/RESTART/@Y@m@d.@H0000.sfc_data.tile6.nc</cyclestr>" 
    DATADEP_SFC2: "<cyclestr>&WARMSTART_DIR;/@Y@m@d.@H0000.sfc_data.tile6.nc</cyclestr>"
    DATADEP_MOM1: "<cyclestr>&DATAROOT;/DATA_SHARE/RESTART/@Y@m@d.@H0000.MOM.res.nc</cyclestr>"
    DATADEP_MOM2: "<cyclestr>&WARMSTART_DIR;/@Y@m@d.@H0000.MOM.res.nc</cyclestr>"
  log:
    value: "&LOGDIR;/workflow.log"
  tasks:
{%- if TYPE_ANAL_FCST != "ctest" %}
    task_prep_data:
      attrs:
        cycledefs: cycled
        maxtries: 2
      envars:
        cyc: "&cyc;"
        PDY: "&PDY;"
      account: "&ACCOUNT;"
      command: '&exp_case_path;/job_cards/jufsda_prep_data'
      jobname: prep_data
      nodes: "&nnodes_prep_data;:ppn=&nprocs_per_node_prep_data;"
      walltime: {{ WALLTIME_PREP_DATA }}
  {%- if NATIVE is not none %}
      native: "&NATIVE;"
  {%- endif %}
  {%- if SCHED == "slurm" %}
      partition: "&PARTITION_QUEUE;"
      queue: "&QOS;"
  {%- elif SCHED == "pbspro" %}
      queue: "&PARTITION_QUEUE;"
  {%- endif %}
      join: "&LOGDIR;/prep_data&LOGFN_SUFFIX;"
  {%- if memory_flag %}
      memory: 128G
  {%- endif %}
      dependency:
        or:
          taskdep_forecast:
            attrs:
              task: forecast
              cycle_offset: '-{{ DATE_CYCLE_FREQ_HR }}:00:00'
          datadep_first:
            value: "&DATADEP_FIRSTCYC;"
  {%- if TYPE_ANAL_FCST == "fcst-1st" %}
          or:
            datadep_sfc1:
              attrs:
                age: 5
              value: "&DATADEP_SFC1;"
            datadep_sfc2:
              attrs:
                age: 5
              value: "&DATADEP_SFC2;"
  {%- endif %}
{%- endif %}
{%- if (date_second_cycle is not none and TYPE_ANAL_FCST != "fcst-only") or (date_second_cycle is none and TYPE_ANAL_FCST == "both" ) or TYPE_ANAL_FCST == "anal-only" or TYPE_ANAL_FCST == "ctest" %}
    task_analysis:
      attrs:
  {%- if COLDSTART == "YES" %}
        cycledefs: cycled_from_second
  {%- else %}
        cycledefs: cycled
  {%- endif %}
        maxtries: 2
      envars:
        cyc: "&cyc;"
        PDY: "&PDY;"
      account: "&ACCOUNT;"
      command: '&exp_case_path;/job_cards/jufsda_analysis'
      jobname: analysis
      nodes: "&nnodes_analysis;:ppn=&nprocs_per_node_analysis;"
  {%- if NATIVE is not none %}
      native: "&NATIVE;"
  {%- endif %}
      walltime: {{ WALLTIME_ANALYSIS }}
  {%- if SCHED == "slurm" %}
      partition: "&PARTITION_QUEUE;"
      queue: "&QOS;"
  {%- elif SCHED == "pbspro" %}
      queue: "&PARTITION_QUEUE;"
  {%- endif %}
      join: "&LOGDIR;/analysis&LOGFN_SUFFIX;"
  {%- if MACHINE == "ursa" %}
      memory: 64G
  {%- endif %}
  {%- if TYPE_ANAL_FCST != "ctest" %}
      dependency:
        and:
          taskdep_prep_data:
            attrs:
              task: prep_data
  {%- endif %}
{%- endif %}
{%- if COLDSTART == "YES" and IC_FROM_FIX_DIR == "NO" %}
    task_fcst_ic:
      attrs:
        cycledefs: first_cycle
        maxtries: 2
      envars:
        cyc: "&cyc;"
        PDY: "&PDY;"
      account: "&ACCOUNT;"
      command: '&exp_case_path;/job_cards/jufsda_fcst_ic'
      jobname: fcst_ic
      nodes: "&nnodes_fcst_ic;:ppn=&nprocs_per_node_fcst_ic;"
      walltime: {{ WALLTIME_FCST_IC }}
  {%- if NATIVE is not none %}
      native: "&NATIVE;"
  {%- endif %}
  {%- if SCHED == "slurm" %}
      partition: "&PARTITION_QUEUE;"
      queue: "&QOS;"
  {%- elif SCHED == "pbspro" %}
      queue: "&PARTITION_QUEUE;"
  {%- endif %}
      join: "&LOGDIR;/fcst_ic&LOGFN_SUFFIX;"
  {%- if memory_flag %}
      memory: 128G
  {%- endif %}
{%- endif %}
{%- if TYPE_ANAL_FCST != "ctest" %}
    task_forecast:
      attrs:
  {%- if TYPE_ANAL_FCST == "fcst-1st" %}
        cycledefs: first_cycle
  {%- else %}
        cycledefs: cycled
  {%- endif %}
        maxtries: 2
      envars:
        cyc: "&cyc;"
        PDY: "&PDY;"
      account: "&ACCOUNT;"
      command: '&exp_case_path;/job_cards/jufsda_forecast'
      jobname: forecast
      nodes: "&nnodes_forecast;:ppn=&nprocs_per_node_forecast;"
      walltime: {{ WALLTIME_FORECAST }}
  {%- if NATIVE is not none %}
      native: "&NATIVE;"
  {%- endif %}
  {%- if SCHED == "slurm" %}
      partition: "&PARTITION_QUEUE;"
      queue: "&QOS;"
  {%- elif SCHED == "pbspro" %}
      queue: "&PARTITION_QUEUE;"
  {%- endif %}
      join: "&LOGDIR;/forecast&LOGFN_SUFFIX;"
      dependency:
        and:
          taskdep_prep_data:
            attrs:
              task: prep_data
          or:
  {%- if IC_FROM_FIX_DIR == "YES" %}
            datadep_coldstart:
              attrs:
                age: 5
              value: "&DATADEP_COLDSTART;"
  {%- else %}
            taskdep_fcst_ic:
              attrs:
                task: fcst_ic
  {%- endif %}
  {%- if TYPE_ANAL_FCST == "both" %}
            taskdep_analysis:
              attrs:
                task: analysis
  {%- else %}
    {%- if APP == "NG-GODAS" %}
            datadep_mom1:
              attrs:
                age: 5
              value: "&DATADEP_MOM1;"
            datadep_mom2:
              attrs:
                age: 5
              value: "&DATADEP_MOM2;"
    {%- else %}
            datadep_sfc1:
              attrs:
                age: 5
              value: "&DATADEP_SFC1;"
            datadep_sfc2:
              attrs:
                age: 5
              value: "&DATADEP_SFC2;"
    {%- endif %}
  {%- endif %}
{%- endif %}
    task_plot_stats:
      attrs:
        cycledefs: cycled
        maxtries: 2
      envars:
        cyc: "&cyc;"
        PDY: "&PDY;"
      account: "&ACCOUNT;"
      command: '&exp_case_path;/job_cards/jufsda_plot_stats'
      jobname: plot_stats
      nodes: "1:ppn=&NPROCS_PLOT_STATS;"
      walltime: {{ WALLTIME_PLOT_STATS }}
{%- if NATIVE is not none %}
      native: "&NATIVE;"
{%- endif %}
  {%- if SCHED == "slurm" %}
      partition: "&PARTITION_QUEUE;"
      queue: "&QOS;"
  {%- elif SCHED == "pbspro" %}
      queue: "&PARTITION_QUEUE;"
  {%- endif %}
      join: "&LOGDIR;/plot_stats&LOGFN_SUFFIX;"
      dependency:
{%- if ( COLDSTART == "YES" and date_second_cycle is none ) or TYPE_ANAL_FCST == "both" %}
        taskdep_forecast:
          attrs:
            task: forecast
{%- else %}
        or:
          taskdep_analysis:
            attrs:
              task: analysis
          taskdep_forecast:
            attrs:
              task: forecast
{%- endif %}
